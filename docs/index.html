import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    # platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"

    bundle = "tacoman"
    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("tacoman.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("tacoman.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # wait for user media interaction (required before audio can play)
    if not platform.window.MM.UME:
        __import__(__name__).__file__ = main
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script>
        window.game_should_start = false;
        window.show_infobox = function() {};

        // hide HTML loading screen once pygame canvas is ready
        window.loadingScreen_hide = function() {
            var el = document.getElementById('loading-screen');
            if (el) el.style.display = 'none';
        };

        // track download progress via pygbag's hidden <progress> element
        var _progressPoll = setInterval(function() {
            var p   = document.getElementById('progress');
            var bar = document.getElementById('loading-bar');
            if (!p || !bar) return;
            var max = p.max || 100;
            var pct = max > 0 ? Math.round((p.value / max) * 100) : 0;
            if (pct > 0) {
                bar.style.width = pct + '%';
                bar.style.animationName = 'none';
            }
        }, 200);

        // show Start button when pygbag signals ready (infobox text check)
        var _poll = setInterval(function() {
            var ib = document.getElementById('infobox');
            if (!ib) return;
            var txt = ib.textContent || '';
            if (txt.indexOf('Ready') < 0 && txt.indexOf('click') < 0 && txt.indexOf('touch') < 0) return;
            clearInterval(_poll);
            clearInterval(_progressPoll);
            var bw  = document.getElementById('loading-bar-wrap');
            var st  = document.getElementById('loading-status');
            var btn = document.getElementById('start-btn');
            if (bw)  bw.style.display  = 'none';
            if (st)  st.style.display  = 'none';
            if (btn) btn.style.display = 'block';
        }, 150);

        document.addEventListener('DOMContentLoaded', function() {
            var btn = document.getElementById('start-btn');
            if (!btn) return;
            function onStart() {
                if (window.game_should_start) return;
                window.game_should_start = true;
                btn.innerText = 'Starting...';
                btn.classList.add('clicked');
            }
            // click only: on mobile, tap synthesizes a click after touchend.
            // That click sets pygbag MM.UME so Python can start.
            btn.addEventListener('click', onStart);
        });
    </script>

    <script type="application/javascript">
    // === Canvas Fit Layout ===
    (function() {
        var _lock = false;

        function applyLayout() {
            if (_lock) return;
            var canvas = document.getElementById('canvas');
            if (!canvas) return;

            var vw = window.innerWidth;
            var vh = window.innerHeight;
            var isMobile = !!window.TACOMAN_MOBILE;
            var gameW = isMobile ? 360  : 1280;
            var gameH = isMobile ? 640  : 720;

            var scale = Math.min(vw / gameW, vh / gameH);
            var canvasW = Math.round(gameW * scale);
            var canvasH = Math.round(gameH * scale);

            console.log('[TacoMan] layout | vw=' + vw + ' vh=' + vh + ' mobile=' + isMobile
                + ' | canvas=' + canvasW + 'x' + canvasH + ' scale=' + scale.toFixed(3));

            _lock = true;
            canvas.style.position  = 'absolute';
            canvas.style.width     = canvasW + 'px';
            canvas.style.height    = canvasH + 'px';
            canvas.style.left      = Math.round((vw - canvasW) / 2) + 'px';
            // mobile: align to top so player isn't hidden behind bottom browser bar
            canvas.style.top       = isMobile ? '0px' : Math.round((vh - canvasH) / 2) + 'px';
            canvas.style.right     = 'auto';
            canvas.style.bottom    = 'auto';
            canvas.style.margin    = '0';
            canvas.style.transform = '';
            _lock = false;
        }

        function attachObserver() {
            var canvas = document.getElementById('canvas');
            if (!canvas) return;
            new MutationObserver(function() {
                if (!_lock) applyLayout();
            }).observe(canvas, { attributes: true, attributeFilter: ['style', 'width', 'height'] });
        }

        window.addEventListener('resize', applyLayout);
        window.addEventListener('orientationchange', function() { setTimeout(applyLayout, 300); });
        document.addEventListener('DOMContentLoaded', function() {
            applyLayout();
            attachObserver();
        });
        [200, 500, 1000, 2000, 3000, 5000].forEach(function(t) {
            setTimeout(applyLayout, t);
        });
    })();
    </script>
